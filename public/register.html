<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign up - Nexus</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Base dark theme styling */
    body { background-color: #18181b; color: #e4e4e7; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    
    /* Floating label input group styles */
    .input-group { position: relative; }
    .input-group input { width: 100%; background-color: transparent; border: 1px solid #3f3f46; border-radius: 8px; padding: 24px 16px 8px 44px; color: white; font-size: 15px; outline: none; transition: border-color 0.2s; }
    .input-group input:focus { border-color: #60a5fa; }
    .input-group label { position: absolute; left: 44px; top: 50%; transform: translateY(-50%); color: #71717a; font-size: 14px; pointer-events: none; transition: 0.2s ease all; }
    .input-group input:focus ~ label, .input-group input:not(:placeholder-shown) ~ label { top: 14px; font-size: 11px; color: #a1a1aa; }
    .input-icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: #71717a; }
    
    /* Password visibility toggle icon */
    .toggle-pwd { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); color: #71717a; cursor: pointer; }
    .toggle-pwd:hover { color: #e4e4e7; }
    
    /* Button styles */
    .btn-primary { background-color: #93c5fd; color: #18181b; border-radius: 8px; font-weight: 600; transition: background-color 0.2s; padding: 12px; }
    .btn-primary:hover { background-color: #bfdbfe; }
    
    /* Custom Checkbox Styles */
    .checkbox-wrapper input:checked + .checkbox-box { background-color: #3b82f6; border-color: #3b82f6; }
    .checkbox-wrapper input:checked + .checkbox-box svg { opacity: 1; }
    
    /* Password Strength Meter */
    .strength-meter { height: 4px; border-radius: 2px; transition: all 0.3s; background-color: #27272a; overflow: hidden; }
    .strength-bar { height: 100%; width: 0%; transition: all 0.3s; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-[440px] bg-[#202023] p-8 rounded-2xl shadow-2xl relative">
    
    <!-- Header: Logo and Language Switcher -->
    <div class="flex justify-between items-center mb-8">
      <div class="flex items-center gap-3">
        <div id="site-logo-container" class="w-10 h-10 rounded-full bg-[#93c5fd] flex items-center justify-center overflow-hidden">
          <svg id="default-logo" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#18181b" stroke-width="2.5"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
          <img id="dynamic-logo-img" src="" alt="Logo" class="w-full h-full object-cover hidden">
        </div>
        <span id="site-name" class="text-[22px] font-bold text-white tracking-wide">Nexus</span>
      </div>
      
      <div id="lang-switcher" class="relative flex items-center">
        <button id="lang-btn" type="button" class="text-gray-400 hover:text-white transition-colors p-2.5 rounded-lg hover:bg-[#27272a] focus:outline-none flex items-center justify-center">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l4-10 4 10"/><path d="M4.5 13h5"/><path d="M14 11a3 3 0 100 6 3 3 0 100-6z"/><path d="M17 11v6"/><path d="M14 14h3"/></svg>
        </button>
        <div id="lang-dropdown" class="hidden absolute right-0 top-full mt-2 w-44 bg-[#2a2a2c] border border-[#3f3f46] rounded-xl shadow-2xl py-2 z-50 max-h-[300px] overflow-y-auto"></div>
      </div>
    </div>

    <h1 class="text-[26px] font-bold text-white mb-8" data-i18n="register.title">Create an account</h1>

    <form id="registerForm" class="space-y-4">
      
      <!-- Email Input -->
      <div class="input-group">
        <span class="input-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 7l-10 7L2 7"/></svg>
        </span>
        <input type="email" id="email" placeholder=" " required>
        <label for="email" data-i18n="login.email">Email address</label>
      </div>

      <!-- Password Input -->
      <div>
        <div class="input-group">
          <span class="input-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          </span>
          <input type="password" id="password" placeholder=" " required>
          <label for="password" data-i18n="login.password">Password</label>
          <!-- Toggle Visibility -->
          <span class="toggle-pwd" id="togglePwdBtn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </span>
        </div>
        <!-- Password Strength Meter -->
        <div class="strength-meter mt-2">
          <div id="strengthBar" class="strength-bar"></div>
        </div>
        <p id="pwdHint" class="text-[11.5px] text-gray-500 mt-1 hidden"></p>
      </div>

      <!-- Confirm Password Input -->
      <div class="input-group">
        <span class="input-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        </span>
        <input type="password" id="confirmPassword" placeholder=" " required>
        <label for="confirmPassword" data-i18n="register.confirm_pwd">Confirm Password</label>
      </div>

      <!-- Human Verification Container -->
      <div id="turnstile-container" class="my-4 flex justify-center hidden"></div>

      <!-- Terms & Privacy Checkbox (GDPR) -->
      <div class="flex items-start gap-3 mt-6 mb-2">
        <label class="checkbox-wrapper relative flex items-center cursor-pointer mt-0.5">
          <input type="checkbox" id="termsCheckbox" class="sr-only" required>
          <div class="checkbox-box w-5 h-5 border border-[#52525b] rounded bg-[#121212] flex items-center justify-center transition-colors">
            <svg class="w-3.5 h-3.5 text-white opacity-0 transition-opacity" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
          </div>
        </label>
        <div class="text-[13px] text-gray-400 leading-snug">
          <span data-i18n="register.agree_prefix">I have read and agree to the</span>
          <a href="/terms" target="_blank" class="text-blue-400 hover:underline" data-i18n="login.terms">Terms of Service</a>
          <span data-i18n="register.and">and</span>
          <a href="/privacy" target="_blank" class="text-blue-400 hover:underline" data-i18n="login.privacy">Privacy Policy</a>.
        </div>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="w-full btn-primary mt-2 text-[15px] font-semibold" data-i18n="register.submit">Sign Up</button>
    </form>

    <!-- Back to Login -->
    <div class="text-center mt-5 text-[14px] text-gray-400">
      <span data-i18n="register.have_account">Already have an account?</span>
      <a href="/login.html" class="text-gray-200 hover:text-white hover:underline ml-1" data-i18n="register.login">Sign in</a>
    </div>

    <!-- Footer -->
    <div class="mt-8 text-center text-[13px] text-gray-400 flex flex-col gap-3">
      <div>
        <a id="powered-by-text" href="https://github.com/CrCLARE/Nexus" target="_blank" rel="noopener noreferrer" class="text-blue-400 hover:underline font-medium">Powered by Nexus</a>
      </div>
    </div>

  </div>

  <!-- Initialization Scripts -->
  <script type="module">
    import { initI18n } from '/js/i18n.js';
    import { initApp, setupRegisterFlow } from '/js/app.js';
    
    // Initialize i18n, load config, then bind register events
    initI18n().then(() => {
      initApp().then(() => {
        setupRegisterFlow();
      });
    });
  </script>
</body>
</html>
