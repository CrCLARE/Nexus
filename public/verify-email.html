<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify Email - Nexus</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Base dark theme styling */
    body { background-color: #18181b; color: #e4e4e7; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    
    /* 
     * Specific styling for the code input box.
     * Fixed: Removed left padding, adjusted letter-spacing and text-indent for perfect centering.
     */
    .code-input-group {
      position: relative;
    }
    .code-input-group input {
      width: 100%;
      background-color: transparent;
      border: 1px solid #3f3f46;
      border-radius: 8px;
      padding: 16px 16px 16px 0; /* Remove left padding, keep vertical and right */
      color: white;
      font-size: 24px;
      font-weight: bold;
      text-align: center; /* Center align the text */
      letter-spacing: 0.5em; /* Add spacing between digits */
      text-indent: 0.5em; /* Compensate for the trailing letter-spacing to keep it visually centered */
      outline: none;
      transition: border-color 0.2s;
    }
    .code-input-group input:focus {
      border-color: #60a5fa;
    }
    .code-input-group input::placeholder {
      color: #3f3f46;
      letter-spacing: normal;
      text-indent: normal;
    }
    
    /* Button styles */
    .btn-primary { background-color: #93c5fd; color: #18181b; border-radius: 8px; font-weight: 600; transition: background-color 0.2s; padding: 12px; }
    .btn-primary:hover { background-color: #bfdbfe; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-[440px] bg-[#202023] p-8 rounded-2xl shadow-2xl relative">
    
    <!-- Header: Logo and Language Switcher -->
    <div class="flex justify-between items-center mb-8">
      <div class="flex items-center gap-3">
        <div id="site-logo-container" class="w-10 h-10 rounded-full bg-[#93c5fd] flex items-center justify-center overflow-hidden">
          <svg id="default-logo" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#18181b" stroke-width="2.5"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
          <img id="dynamic-logo-img" src="" alt="Logo" class="w-full h-full object-cover hidden">
        </div>
        <span id="site-name" class="text-[22px] font-bold text-white tracking-wide">Nexus</span>
      </div>
      
      <div id="lang-switcher" class="relative flex items-center">
        <button id="lang-btn" type="button" class="text-gray-400 hover:text-white transition-colors p-2.5 rounded-lg hover:bg-[#27272a] focus:outline-none flex items-center justify-center">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l4-10 4 10"/><path d="M4.5 13h5"/><path d="M14 11a3 3 0 100 6 3 3 0 100-6z"/><path d="M17 11v6"/><path d="M14 14h3"/></svg>
        </button>
        <div id="lang-dropdown" class="hidden absolute right-0 top-full mt-2 w-44 bg-[#2a2a2c] border border-[#3f3f46] rounded-xl shadow-2xl py-2 z-50 max-h-[300px] overflow-y-auto"></div>
      </div>
    </div>

    <!-- Content -->
    <div class="text-center mb-6">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-blue-500/10 mb-4">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#60a5fa" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 7l-10 7L2 7"/></svg>
      </div>
      <h1 class="text-[24px] font-bold text-white mb-2" data-i18n="verify.title">Check your email</h1>
      <p class="text-[14px] text-gray-400">
        <span data-i18n="verify.sent_to">We sent a 6-digit verification code to</span>
        <br/>
        <span id="displayEmail" class="text-gray-200 font-medium"></span>
      </p>
    </div>

    <form id="verifyForm" class="space-y-4">
      <!-- Code Input (Fixed alignment) -->
      <div class="code-input-group">
        <input type="text" id="code" maxlength="6" required autocomplete="one-time-code">
      </div>

      <!-- Submit Button -->
      <button type="submit" class="w-full btn-primary mt-4 text-[15px] font-semibold" data-i18n="verify.submit">Verify</button>
    </form>

    <!-- Resend Logic -->
    <div class="text-center mt-6 text-[13px] text-gray-400">
      <span data-i18n="verify.no_code">Didn't receive the code?</span>
      <button id="resendBtn" class="text-blue-400 hover:text-blue-300 hover:underline ml-1 disabled:opacity-50 disabled:no-underline disabled:cursor-not-allowed" data-i18n="verify.resend">Resend</button>
    </div>

    <!-- Footer -->
    <div class="mt-8 text-center text-[13px] text-gray-400 flex flex-col gap-3">
      <div>
        <a id="powered-by-text" href="https://github.com/CrCLARE/Nexus" target="_blank" rel="noopener noreferrer" class="text-blue-400 hover:underline font-medium">Powered by Nexus</a>
      </div>
    </div>

  </div>

  <!-- Initialization Scripts -->
  <script type="module">
    import { initI18n } from '/js/i18n.js';
    import { initApp, setupVerifyEmailFlow } from '/js/app.js';
    
    initI18n().then(() => {
      initApp().then(() => {
        setupVerifyEmailFlow();
      });
    });
  </script>
</body>
</html>
